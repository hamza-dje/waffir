name: wafir
description: A daily budgeting companion for Algeria.
publish_to: none
version: 0.6.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_svg: ^2.0.17
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.3.5
  timezone: ^0.11.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/dzd.svg
    - assets/icons/
    - assets/fonts/Geist-OFL.txt
    - assets/fonts/GeistMono-OFL.txt
    - assets/fonts/Rubik-OFL.txt
    - assets/fonts/RedHatDisplay-OFL.txt
  fonts:
    - family: RedHatDisplay
      fonts:
        - asset: assets/fonts/RedHatDisplay-400.ttf
          weight: 400
        - asset: assets/fonts/RedHatDisplay-500.ttf
          weight: 500
        - asset: assets/fonts/RedHatDisplay-600.ttf
          weight: 600
        - asset: assets/fonts/RedHatDisplay-700.ttf
          weight: 700
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-400.ttf
          weight: 400
        - asset: assets/fonts/Geist-500.ttf
          weight: 500
        - asset: assets/fonts/Geist-600.ttf
          weight: 600
        - asset: assets/fonts/Geist-700.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-400.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-500.ttf
          weight: 500
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-400.ttf
          weight: 400
        - asset: assets/fonts/Rubik-500.ttf
          weight: 500
        - asset: assets/fonts/Rubik-600.ttf
          weight: 600
